services:
  # Public reverse proxy / single entrypoint
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443" # Enable when TLS certificates are added
    volumes:
      - ./nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - edutube-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: Video_Portal_Dummy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pgadmin
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - edutube-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-seed:
    image: postgres:15-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: pgadmin
    networks:
      - edutube-network
    volumes:
      - ./edutube-backend/dump/latest.dump:/dump/seed.dump:ro
    # Idempotent: on redeploy the Postgres volume already has data — pg_restore --clean would still
    # conflict in many cases. Skip restore when `users` already has rows.
    entrypoint:
      - sh
      - -c
      - |
          set -e
          until pg_isready -h postgres -U postgres; do sleep 1; done
          ROWS=$$(psql -h postgres -U postgres -d Video_Portal_Dummy -t -A -c "SELECT COUNT(*) FROM users" 2>/dev/null || echo "")
          if [ -n "$$ROWS" ] && [ "$$ROWS" -gt 0 ] 2>/dev/null; then
            echo "db-seed: database already contains data (users count=$$ROWS), skipping pg_restore"
            exit 0
          fi
          echo "db-seed: restoring dump into empty database..."
          pg_restore --clean --if-exists --no-owner --role=postgres -h postgres -U postgres -d Video_Portal_Dummy /dump/seed.dump
    restart: "no"

  # Redis
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - edutube-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./edutube-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=5001
      - CORS_ORIGINS=http://localhost,http://localhost:3000,http://localhost:4000,http://127.0.0.1:3000,http://127.0.0.1:4000,http://172.16.95.109,http://172.16.95.109:4000,http://edutube.college.local,https://edutube.college.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully
    expose:
      - "5001"
    networks:
      - edutube-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://localhost:5001/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend
  frontend:
    build:
      context: ./edutube
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=4000
      - BACKEND_URL=http://backend:5001
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "4000"
    networks:
      - edutube-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4000/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  edutube-network:
    driver: bridge
