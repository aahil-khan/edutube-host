groups:
  - name: edutube-mvp-alerts
    rules:
      - alert: BackendDown
        expr: up{job="backend-metrics"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Backend instance down"
          description: "A backend replica is unreachable by Prometheus."

      - alert: HighBackend5xxRate
        expr: sum(rate(http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High backend 5xx rate"
          description: "5xx ratio is above 5% over the last 5 minutes."

      - alert: HighBackendP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High backend p95 latency"
          description: "Backend p95 latency is over 1.5s for 10 minutes."

      - alert: ContainerHighCPU
        expr: sum by (name) (rate(container_cpu_usage_seconds_total{name=~".+"}[5m])) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container high CPU usage"
          description: "Container CPU usage has been above 0.8 cores."

      - alert: ContainerHighMemory
        expr: (container_memory_working_set_bytes{name=~".+"} / clamp_min(container_spec_memory_limit_bytes{name=~".+"}, 1)) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container high memory usage"
          description: "Container memory utilization exceeds 90% of limit."
